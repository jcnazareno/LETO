<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Trade Explorer — lunar impact-flash mission</title>
<style>
:root {
  --bg: #0a0e13;
  --bg2: #0e141b;
  --panel: #111820;
  --panel2: #151e28;
  --line: #1f2b38;
  --line2: #2a3949;
  --text: #dbe2ea;
  --text2: #b3bfcc;
  --muted: #8494a6;
  --amber: #f0a53a;
  --amber2: #ffc46b;
  --amber-bg: rgba(240, 165, 58, 0.10);
  --cyan: #38c6d6;
  --cyan2: #7fe3ee;
  --cyan-bg: rgba(56, 198, 214, 0.10);
  --warn: #ff8a73;
  --good: #8fd694;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 var(--font); }
body { min-width: 1100px; min-height: 680px; overflow: hidden; }
.num, .val, .kpi-v, .ro-v, .ctl-val { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }

/* ---------------- header ---------------- */
.top {
  height: 68px; display: flex; align-items: stretch; gap: 14px; padding: 0 14px;
  border-bottom: 1px solid var(--line); background: linear-gradient(#0f151d, #0c1117);
}
.brand { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 0 1 190px; }
.brand .t1 { font-weight: 650; font-size: 15px; letter-spacing: 0.02em; white-space: nowrap; }
.brand .t2 { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpis { display: flex; flex: 1 1 auto; min-width: 0; align-items: stretch; }
.kpi { display: flex; flex-direction: column; justify-content: center; padding: 0 10px; border-left: 1px solid var(--line); min-width: 0; flex: 1 1 0; }
.kpi:first-child { flex: 1.6 1 0; }
.kpi-l { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-v { font-size: 17px; font-weight: 600; white-space: nowrap; }
.kpi-v small { font-size: 12px; font-weight: 400; color: var(--text2); }
.kpi-s { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.amber .kpi-v { color: var(--amber2); }
.kpi.cyan .kpi-v { color: var(--cyan2); }
.pairbar { position: relative; height: 6px; background: #1b2531; border-radius: 3px; flex: 0 0 64px; align-self: center; }
.pairrow2 { display: flex; gap: 8px; align-items: center; min-width: 0; }
.pairbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--amber), var(--cyan)); }
.pairbar .tick { position: absolute; top: -3px; width: 1px; height: 12px; background: #c9d3de; opacity: 0.8; }
.pairrow { display: flex; align-items: baseline; gap: 8px; }
.top .reset {
  align-self: center; white-space: nowrap; padding: 7px 12px; border-radius: 6px; cursor: pointer;
  background: #18222d; border: 1px solid var(--line2); color: var(--text);
}
.top .reset:hover { background: #1e2a37; }

/* ---------------- grid ---------------- */
.grid {
  height: calc(100vh - 68px); min-height: 612px;
  display: grid; grid-template-columns: clamp(286px, 22.5vw, 336px) minmax(0, 1fr) clamp(286px, 22.5vw, 336px);
}
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.panel.imager { border-right: 1px solid var(--line); }
.panel.monitor { border-left: 1px solid var(--line); }
.ph { padding: 10px 14px 9px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ph .phase { font-size: 12px; letter-spacing: 0.08em; font-weight: 600; padding: 1px 6px; border-radius: 3px; }
.ph .title { font-weight: 650; letter-spacing: 0.04em; font-size: 13px; }
.ph .sub { color: var(--muted); font-size: 12px; flex-basis: 100%; }
.imager .ph { border-top: 2px solid var(--cyan); }
.imager .ph .phase { background: var(--cyan-bg); color: var(--cyan2); }
.imager .ph .title { color: var(--cyan2); }
.monitor .ph { border-top: 2px solid var(--amber); }
.monitor .ph .phase { background: var(--amber-bg); color: var(--amber2); }
.monitor .ph .title { color: var(--amber2); }
.pbody { overflow-y: auto; overflow-x: hidden; flex: 1 1 auto; padding: 4px 0 18px; scrollbar-width: thin; scrollbar-color: #2a3949 transparent; }
.sec { padding: 8px 14px 6px; }
.sec + .sec { border-top: 1px solid var(--line); }
.sec-h { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 2px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.sec-h .tag { white-space: nowrap; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--text2); }
.zone-h { margin: 6px 14px 0; padding: 6px 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: var(--text2); border-bottom: 1px dashed var(--line2); }

/* ---------------- controls ---------------- */
.ctl { margin: 0 0 9px; }
.ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ctl-head label { color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl-val { font-weight: 600; white-space: nowrap; }
.ctl.changed .ctl-val::before { content: "\25CF\00a0"; font-size: 9px; vertical-align: 2px; }
.imager .ctl.changed .ctl-val { color: var(--cyan2); }
.monitor .ctl.changed .ctl-val { color: var(--amber2); }
.ctl-track { position: relative; height: 18px; }
.ctl-track .bmark { position: absolute; top: 1px; width: 2px; height: 5px; background: #9aa8b8; border-radius: 1px; transform: translateX(-1px); pointer-events: none; }
.ctl-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: -1px; }
.ctl-foot .bl { cursor: pointer; border-bottom: 1px dotted transparent; }
.ctl.changed .ctl-foot .bl { color: var(--text2); border-bottom-color: var(--muted); }
.ctl.changed .ctl-foot .bl:hover { color: var(--text); }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; display: block; }
input[type=range]:focus { outline: none; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: #243142; margin-top: 7px; }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #243142; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; margin-top: -5px; background: #dfe6ee; border: 2px solid #0b1016; box-shadow: 0 0 0 1px #3a4a5c; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #dfe6ee; border: 2px solid #0b1016; }
.imager input[type=range]::-webkit-slider-thumb { background: var(--cyan2); }
.monitor input[type=range]::-webkit-slider-thumb { background: var(--amber2); }
.imager input[type=range]::-moz-range-thumb { background: var(--cyan2); }
.monitor input[type=range]::-moz-range-thumb { background: var(--amber2); }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(255,255,255,0.35); }

.seg { display: flex; border: 1px solid var(--line2); border-radius: 5px; overflow: hidden; margin-top: 3px; }
.seg button { flex: 1 1 0; background: transparent; border: 0; padding: 4px 4px; cursor: pointer; color: var(--text2); white-space: nowrap; font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button:hover { background: #18222d; color: var(--text); }
.imager .seg button.on { background: var(--cyan-bg); color: var(--cyan2); box-shadow: inset 0 -2px 0 var(--cyan); }
.monitor .seg button.on, .tabtools .seg button.on { background: var(--amber-bg); color: var(--amber2); box-shadow: inset 0 -2px 0 var(--amber); }
.ctl.changed .seg { border-color: #4a5a6c; }
.btn { background: #18222d; border: 1px solid var(--line2); border-radius: 5px; padding: 5px 10px; cursor: pointer; color: var(--text); font-size: 12px; }
.btn:hover { background: #1f2b38; }
.btnrow { display: flex; gap: 8px; align-items: center; margin: 2px 0 8px; flex-wrap: wrap; }
.btnrow .note { color: var(--muted); font-size: 12px; }
details.adv { margin: 2px 0 4px; }
details.adv > summary { cursor: pointer; color: var(--text2); font-size: 12px; padding: 4px 0; list-style: none; }
details.adv > summary::before { content: "\25B8\00a0"; color: var(--muted); }
details.adv[open] > summary::before { content: "\25BE\00a0"; }

/* ---------------- readouts ---------------- */
.ro { display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; align-items: baseline; column-gap: 6px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.025); }
.ro-l { color: var(--text2); overflow: hidden; overflow-wrap: break-word; }
.ro-v { text-align: right; white-space: nowrap; font-weight: 550; }
.ro-v .u { color: var(--muted); font-weight: 400; margin-left: 3px; }
.ro-v .flag { font-weight: 500; font-size: 12px; padding: 0 4px; border-radius: 3px; margin-left: 4px; border: 1px solid currentColor; }
.flag.warn { color: var(--warn); }
.flag.ok { color: var(--good); }
.flag.info { color: var(--text2); }
.ro-i { color: var(--muted); cursor: help; font-size: 12px; text-align: center; user-select: none; }
.ro-i:hover { color: var(--text); }
.ro.key .ro-v { font-size: 14px; }
.imager .ro.key .ro-v { color: var(--cyan2); }
.monitor .ro.key .ro-v { color: var(--amber2); }
.ro-wide { color: var(--muted); font-size: 12px; padding: 3px 0 2px; }
.stale { color: var(--muted); font-size: 12px; }
.stale.on::after { content: "updating\2026"; color: var(--text2); }

/* ---------------- centre ---------------- */
.centre { display: grid; grid-template-rows: minmax(250px, 52fr) minmax(250px, 48fr); grid-template-columns: minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--bg); }
.v3d { position: relative; min-height: 0; border-bottom: 1px solid var(--line); overflow: hidden;
  background: radial-gradient(ellipse at 50% 45%, #0f1720 0%, #0a0e13 70%); }
.v3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.v3d canvas.drag { cursor: grabbing; }
.v3d .hud { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; align-items: center; }
.v3d .hud .btn { background: rgba(17,24,32,0.85); }
.v3d .hud select { background: rgba(17,24,32,0.85); color: var(--text); border: 1px solid var(--line2); border-radius: 5px; padding: 4px 4px; font: 12px var(--font); }
.v3d .cap { position: absolute; top: 9px; left: 12px; color: var(--muted); font-size: 12px; pointer-events: none; }
.v3d .simt { position: absolute; top: 40px; right: 10px; color: var(--muted); font-size: 12px; pointer-events: none; text-align: right; }

.tabs { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.centre > * { min-width: 0; }
.tabbar { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: var(--bg2); padding: 0 6px; gap: 2px; }
.tabbar button { background: transparent; border: 0; padding: 8px 8px 7px; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; font-size: 12.5px; }
.tabbar button:hover { color: var(--text); }
.tabbar button.on { color: var(--text); border-bottom-color: #c9d3de; }
.tabbar button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.tabtools { display: flex; align-items: center; gap: 10px; padding: 6px 10px 0; min-height: 30px; flex-wrap: wrap; }
.tabtools .lbl { color: var(--muted); font-size: 12px; }
.tabtools .seg { margin: 0; }
.tabtools .seg button { padding: 3px 8px; }
.tabtools .cap2 { color: var(--muted); font-size: 12px; margin-left: auto; }
.tabcanvas { position: relative; flex: 1 1 auto; min-height: 0; }
.tabcanvas canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.caption { padding: 3px 10px 6px; color: var(--muted); font-size: 12px; min-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabtools .seg button { flex: 0 0 auto; }

.top .reset .short { display: none; }
@media (max-width: 1320px) {
  .brand { flex: 0 0 auto; }
  .brand .t1 { font-size: 14px; }
  .brand .t2 { display: none; }
  .top .reset .long { display: none; }
  .top .reset .short { display: inline; }
  .top { gap: 10px; padding: 0 10px; }
  .kpi { padding: 0 7px; }
  .top .hbtn { padding: 7px 8px; }
  .top .reset { padding: 7px 9px; }
}

/* ---------------- v2: header buttons ---------------- */
.top .hbtn { align-self: center; white-space: nowrap; padding: 7px 10px; border-radius: 6px; cursor: pointer; background: #18222d; border: 1px solid var(--line2); color: var(--text); font-size: 12.5px; }
.top .hbtn:hover { background: #1e2a37; }
.top .hbtn.opt { border-color: #5a6c80; font-weight: 600; }
.top .limchip { color: var(--good); border-color: rgba(143,214,148,0.45); }
.top .limchip.bad { color: var(--warn); border-color: rgba(255,138,115,0.6); }
.top .undo[hidden] { display: none; }

/* ---------------- v2: lock toggles ---------------- */
.ctl-right { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.lock { font: 600 11px/1 var(--font); letter-spacing: 0.02em; padding: 2px 5px; border-radius: 3px; cursor: pointer; min-width: 38px; text-align: center;
  background: transparent; color: var(--muted); border: 1px solid var(--line2); }
.lock[aria-pressed="false"] { color: #0b1016; background: var(--good); border-color: var(--good); }
.lock:hover { border-color: var(--text2); }
.ctl.locked input[type=range] { opacity: 0.85; }
.viol { color: var(--warn); font-size: 12px; }

/* ---------------- v2: notes, flash check ---------------- */
.ro-wide.note2 { color: var(--text2); border-left: 2px solid #5a6c80; padding-left: 6px; margin-top: 4px; }
.fc { margin-top: 8px; padding: 8px; border: 1px solid var(--line2); border-radius: 6px; background: #0f151c; }
.fc-h { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
.fc-l { display: block; color: var(--text2); font-size: 12px; margin-bottom: 6px; }
.fc-l select { display: block; width: 100%; margin-top: 3px; background: #18222d; color: var(--text); border: 1px solid var(--line2); border-radius: 4px; padding: 3px; font: 12px var(--font); }
.fc-run { width: 100%; }
.fc-run:disabled { opacity: 0.7; cursor: progress; }
.fc-out { margin-top: 6px; font-size: 12px; color: var(--text2); line-height: 1.4; overflow-wrap: anywhere; }
.fc-out > div { margin-top: 3px; }
.fc-out.stale { opacity: 0.55; }
.fc-out.stale::before { content: "stale — inputs changed since this run"; display: block; color: var(--warn); font-weight: 600; }
.fc-err { color: var(--warn); }
.fc-err code { color: var(--text); background: #18222d; padding: 0 3px; border-radius: 3px; }
.fc-in, .fc-meta { color: var(--muted); }
.fc-notes { margin: 4px 0 0 16px; padding: 0; }
.chip { display: inline-block; padding: 0 6px; border-radius: 3px; border: 1px solid currentColor; font-weight: 600; }
.chip.supported { color: var(--good); } .chip.marginal { color: var(--amber2); } .chip.not_supported { color: var(--warn); }

/* ---------------- v2: limits tab ---------------- */
#tabhtml { position: absolute; inset: 0; overflow: auto; padding: 4px 10px 8px; }
#tabhtml[hidden] { display: none; }
.tabcanvas canvas[hidden] { display: none; }
table.lim { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.lim th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line2); position: sticky; top: 0; background: var(--bg); }
table.lim td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.lim .r { text-align: right; font-variant-numeric: tabular-nums; }
table.lim .nowrap { white-space: nowrap; }
.lim-l { color: var(--text); }
.lim-b { color: var(--muted); font-size: 12px; }
.lim-in { width: 64px; background: #18222d; color: var(--text); border: 1px solid var(--line2); border-radius: 3px; padding: 1px 4px; font: 12px var(--font); text-align: right; }
.lim-u, .lim-s { color: var(--muted); }
.lim-st { white-space: nowrap; font-weight: 600; }
.good { color: var(--good); } .bad { color: var(--warn); } .off { color: var(--muted); }
tr.dis .lim-l, tr.dis .lim-v { color: var(--muted); }
.lim-note { margin: 8px 0 0; color: var(--text2); font-size: 12px; border-left: 2px solid #5a6c80; padding-left: 8px; }

/* ---------------- v2: optimiser dialog ---------------- */
.modal { position: fixed; inset: 0; background: rgba(5,8,12,0.66); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal[hidden] { display: none; }
.dlg { width: min(640px, 92vw); max-height: 88vh; overflow: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 14px 18px 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.dlg h2 { margin: 0 0 6px; font-size: 16px; }
.dlg h3 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.dlg .cap { margin: 0 0 10px; color: var(--text2); font-size: 12px; }
.dlg .row { margin: 6px 0; color: var(--text2); }
.dlg .muted, .muted { color: var(--muted); font-size: 12px; }
.dlg .freelist { color: var(--text); }
.dlg .seg.inl { display: inline-flex; vertical-align: middle; margin: 0 0 0 4px; }
.dlg .seg.inl button { flex: 0 0 auto; padding: 3px 8px; }
.dlg .btns { display: flex; gap: 8px; margin-top: 14px; }
.btn.primary { background: #23415a; border-color: #3f6f94; font-weight: 600; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.prog { height: 8px; background: #1b2531; border-radius: 4px; overflow: hidden; margin: 10px 0 4px; }
.prog .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--amber), var(--cyan)); transition: width 0.15s; }
.warnbox { border: 1px solid rgba(255,138,115,0.6); color: var(--warn); border-radius: 5px; padding: 6px 8px; margin: 6px 0; font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin: 8px 0; }
.kv > div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 2px 0; }
.kv span { color: var(--muted); }
table.tt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.tt td { padding: 2px 6px; border-bottom: 1px solid var(--line); }
table.tt .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.ctl-track .tmark { position: absolute; top: 12px; width: 1px; height: 6px; background: #c9d3de; opacity: 0.55; transform: translateX(-0.5px); }
.ctl-marks { color: var(--muted); font-size: 12px; margin-top: 1px; }
.kpi-l.stag { color: var(--amber2); }

</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="t1">Orbit Trade Explorer</div>
    <div class="t2" title="Proposal rev. 5, Option A: one spacecraft, flash monitoring from a high polar orbit, then crater imaging from a low orbit">Lunar impact-flash mission</div>
  </div>
  <div class="kpis" id="kpis"></div>
  <button class="hbtn limchip" id="limChip" title="Constraint check (§E). Click to open the Limits &amp; checks tab.">Limits —</button>
  <button class="hbtn undo" id="undoOpt" hidden title="Restore the state from before the last applied optimisation">Undo optimise</button>
  <button class="hbtn opt" id="optBtn" title="Sweep the free sliders to maximise indicative pairs within all enabled limits">Optimise</button>
  <button class="reset" id="resetAll" title="Reset to proposal baseline: restore every input"><span class="long">Reset to proposal baseline</span><span class="short">Reset baseline</span></button>
</header>
<main class="grid">
  <aside class="panel imager" aria-label="Phase 2 crater imager">
    <div class="ph"><span class="phase">PHASE 2</span><span class="title">CRATER IMAGER</span><span class="sub">low circular polar orbit · narrow-field camera finds the fresh craters</span></div>
    <div class="pbody" id="leftBody"></div>
  </aside>
  <section class="centre">
    <div class="v3d" id="v3d">
      <canvas id="c3d" aria-label="3D view of the Moon with both orbits"></canvas>
      <div class="cap">To scale · drag to rotate · wheel to zoom</div>
      <div class="hud">
        <button class="btn" id="play" title="Play / pause the orbital motion">Play</button>
        <select id="speed" title="Time acceleration (both spacecraft share it)">
          <option value="200">×200</option>
          <option value="600" selected>×600</option>
          <option value="2000">×2000</option>
          <option value="6000">×6000</option>
        </select>
        <button class="btn" id="resetView" title="Reset rotation and zoom">Reset view</button>
      </div>
      <div class="simt" id="simt"></div>
    </div>
    <div class="tabs">
      <div class="tabbar" id="tabbar" role="tablist"></div>
      <div class="tabtools" id="tabtools"></div>
      <div class="tabcanvas" id="tabwrap"><canvas id="ctab"></canvas><div id="tabhtml" hidden></div></div>
      <div class="caption" id="caption"></div>
    </div>
  </section>
  <aside class="panel monitor" aria-label="Phase 1 flash monitor">
    <div class="ph"><span class="phase">PHASE 1</span><span class="title">FLASH MONITOR</span><span class="sub">high circular polar orbit · event-camera mosaic watches the night side</span></div>
    <div class="pbody" id="rightBody"></div>
  </aside>
</main>

  // ------------------------------------------------------------------ §G event-simulator flash check
  function flashCheckHtml() {
    return '<div class="fc" id="fc"><div class="fc-h">Event-simulator check</div>' +
      '<label class="fc-l">Sensor profile <select class="fcSensor" id="fcSensor">' +

  }
  var fcInputs = null, fcBusy = false;
  function fcKey() { return [state.h1, state.f1, state.N1, state.decay, state.emax].join('|'); }
  function markFlashStale() {
    var out = document.getElementById('fcOut');

  }
  function bridgeUrl() {
    var local = /^https?:$/.test(location.protocol) && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    return local ? '/api/flash_check' : 'http://127.0.0.1:8765/api/flash_check';
  }
  function runFlashCheck() {
    if (fcBusy || !lastRes) return;
    var r = lastRes, btn = document.getElementById('fcRun'), out = document.getElementById('fcOut');
    var body = { h1_km: state.h1, focal_mm: state.f1, fnum: state.N1, tau_s: r.mon.tau, e_test_J: Math.round(r.mon.EminEdge), range_km: Math.round(r.mon.rhoEdge * 10) / 10, sensor: state.sensor };
    fcInputs = { key: fcKey(), body: body };
    fcBusy = true; btn.disabled = true; out.classList.remove('stale');
    var t0 = Date.now();
    var tick = setInterval(function () { btn.textContent = 'Simulating… (10–70 s) ' + Math.round((Date.now() - t0) / 1000) + ' s'; }, 500);
    btn.textContent = 'Simulating… (10–70 s) 0 s';
    out.innerHTML = '<div class="fc-in">' + esc(inputsText(body)) + '</div>';
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 300000);
    var done = function () { clearInterval(tick); clearTimeout(to); fcBusy = false; btn.disabled = false; btn.textContent = 'Check threshold with event simulator'; };
    var p;
    try {
      p = fetch(bridgeUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined });
    } catch (e) { p = Promise.reject(e); }
    p.then(function (resp) {
      return resp.text().then(function (t) { var j; try { j = JSON.parse(t); } catch (e) { j = { ok: false, code: 'bad_response', error: 'HTTP ' + resp.status + ': response is not JSON' }; } return j; });
    }).then(function (j) { done(); showFlashResult(j, body); markFlashStale(); },
      function (err) {
        done();
        if (err && err.name === 'AbortError') showFlashResult({ ok: false, code: 'timeout', error: 'No answer from the bridge within 300 s.' }, body);
        else showUnreachable(body);
      });
  }
  function inputsText(b) {
    return 'Run for h1 ' + b.h1_km + ' km · f ' + b.focal_mm + ' mm f/' + b.fnum + ' · τ ' + b.tau_s + ' s · E_test ' + b.e_test_J.toLocaleString('en-US') + ' J at ' + b.range_km + ' km · ' + b.sensor;
  }
  function showUnreachable(body) {
    document.getElementById('fcOut').innerHTML = '<div class="fc-err" id="fcUnreach"><b>Event-simulator bridge not reachable.</b> Start it on the project computer: <code>python analysis/orbit_trade_explorer/serve.py</code>, then open http://127.0.0.1:8765 (or press the button again from this file).</div><div class="fc-in">' + esc(inputsText(body)) + '</div>';
  }
  function showFlashResult(j, body) {
    var out = document.getElementById('fcOut');
    if (!j || !j.ok) {
      out.innerHTML = '<div class="fc-err"><b>Simulator check failed</b> (' + esc((j && j.code) || 'unknown') + '): ' + esc((j && j.error) || 'no details') + '</div><div class="fc-in">' + esc(inputsText(body)) + '</div>';
      return;
    }
    var lv = {}; (j.levels || []).forEach(function (l) { lv[l.factor] = l; });
    var v = j.verdict, vt = { supported: 'Threshold supported', marginal: 'Threshold marginal', not_supported: 'Threshold NOT supported' }[v] || String(v);
    var row = function (f, t) { var l = lv[f]; return l ? '<div>' + t + ': ' + l.detected + '/' + l.n + ' detected</div>' : ''; };
    var at1 = lv[1] || lv['1'];
    out.innerHTML = '<div class="fc-v"><span class="chip ' + esc(v) + '">' + esc(v.replace('_', ' ')) + '</span> ' + esc(vt) + '</div>' +
      (at1 ? '<div><b>' + at1.detected + '/' + at1.n + '</b> detected at the threshold (95 % lower bound ' + Math.round((j.lower95 || 0) * 100) + ' %)</div>' : '') +
      row(0.5, '0.5× threshold') + row(2, '2× threshold') +
      '<div>False triggers: ' + esc(j.n_false) + '</div>' +
      '<div class="fc-meta">Scene ' + esc(j.scene) + ' · sensor ' + esc(j.sensor) + ' · drift ' + esc(j.drift_px_s) + ' px/s · scene range ' + esc(j.scene_range_km) + ' km · ' + esc(j.wall_s) + ' s</div>' +
      (j.message ? '<div>' + esc(j.message) + '</div>' : '') +
      (j.notes && j.notes.length ? '<ul class="fc-notes">' + j.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') +
      '<div class="fc-in">' + esc(inputsText(body)) + '</div>';
  }
  // exposed for the smoke test (renders a canned bridge response without a server)
  window.__OTE_showFlashResult = function (j) { fcInputs = { key: fcKey() }; showFlashResult(j, { h1_km: state.h1, focal_mm: state.f1, fnum: state.N1, tau_s: lastRes.mon.tau, e_test_J: Math.round(lastRes.mon.EminEdge), range_km: Math.round(lastRes.mon.rhoEdge * 10) / 10, sensor: state.sensor }); };

  // ------------------------------------------------------------------ §H optimiser dialog
  var opt = { run: null, timer: null, result: null, undo: null };
  var OPT_CAPTION = 'Maximises the indicative pair index — a screening scaling, not the Monte Carlo. The optimum usually sits on a constraint; check which one.';
  function sliderLabel(k) { var e = ctlEls[k]; return e ? e.def.label : k; }
  function sliderFmt(k, v) { var e = ctlEls[k]; return e && e.def.f ? e.def.f(v) : String(v); }
  function openOpt() { document.getElementById('optModal').hidden = false; renderOptSetup(); }
  function closeOpt() { if (opt.run) { opt.run.cancel(); } clearTimeout(opt.timer); opt.run = null; document.getElementById('optModal').hidden = true; }
  function renderOptSetup() {
    var free = OPT.SPECS.filter(function (s) { return locks[s.k] === false; });
    var d = document.getElementById('optDlg');
    d.innerHTML = '<h2 id="optTitle">Optimise</h2><p class="cap">' + esc(OPT_CAPTION) + '</p>' +
      '<div class="row">Free sliders (' + free.length + '): <span class="freelist">' + (free.length ? free.map(function (s) { return esc(sliderLabel(s.k)); }).join(', ') : 'none') + '</span></div>' +
      '<div class="row">Locks: <span class="seg inl"><button type="button" data-preset="all">lock all</button><button type="button" data-preset="default">free design variables (default)</button><button type="button" data-preset="none">free all</button></span></div>' +
      '<div class="row muted">Sweeps only sliders; decay class, Isp, sensor profile and camera preset stay; orientation is evaluated as “auto”. Enabled limits: ' +
      lastRes.constraints.filter(function (c) { return c.enabled; }).length + '/' + lastRes.constraints.length + '.</div>' +
      '<div class="btns"><button type="button" class="btn primary" id="optRun"' + (free.length ? '' : ' disabled') + '>' + (free.length ? 'Run optimiser' : 'Free at least one slider') + '</button><button type="button" class="btn" id="optClose">Close</button></div>';
  }
  function startOpt() {
    var base = Object.assign({}, state);
    opt.run = OPT.createOptimizer(base, Object.assign({}, locks));
    opt.base = base;
    var d = document.getElementById('optDlg');
    d.innerHTML = '<h2 id="optTitle">Optimising…</h2><p class="cap">' + esc(OPT_CAPTION) + '</p>' +
      '<div class="prog"><div class="bar" id="optBar"></div></div><div class="row" id="optStat">starting…</div>' +
      '<div class="btns"><button type="button" class="btn" id="optCancel">Cancel</button></div>';
    var loop = function () {
      if (!opt.run) return;
      var p = opt.run.step(40);
      document.getElementById('optBar').style.width = Math.round(p.fraction * 100) + '%';
      document.getElementById('optStat').textContent = p.phase + ' · ' + p.evals.toLocaleString('en-US') + ' evaluations · ' + (p.elapsedMs / 1000).toFixed(1) + ' s' +
        (p.best ? ' · best so far ' + Math.round(p.best.pairs) + ' pairs' + (p.best.feasible ? '' : ' (infeasible)') : '');
      if (p.done) { renderOptResult(opt.run.result()); opt.run = null; return; }
      opt.timer = setTimeout(loop, 0);
    };
    opt.timer = setTimeout(loop, 0);
  }
  function renderOptResult(res) {
    opt.result = res;
    var d = document.getElementById('optDlg');
    if (res.nothing) { d.innerHTML = '<h2 id="optTitle">Nothing to optimise</h2><div class="btns"><button type="button" class="btn" id="optClose">Close</button></div>'; return; }
    var r = res.result;
    var head = res.feasible ? 'Optimum found' : 'No feasible point found';
    var html = '<h2 id="optTitle">' + head + '</h2><p class="cap">' + esc(OPT_CAPTION) + '</p>';
    if (!res.feasible) html += '<div class="warnbox" id="optNoFeas">No combination of the free sliders satisfies every enabled limit. Shown below is the <b>least-infeasible point</b> (smallest summed normalised violation); applying it will leave limits violated.</div>';
    if (res.truncated) html += '<div class="warnbox">Stopped at the 60 s cap: this is the best point found so far.</div>';
    if (res.cancelled) html += '<div class="warnbox">Cancelled: this is the best point found so far.</div>';
    html += '<div class="kv"><div><span>Indicative pairs</span><b>' + Math.round(res.startPairs) + ' → ' + Math.round(res.pairs) + '</b>' + (r.pairs.extrapolated ? ' <span class="flag warn">extrapolated below 3 m</span>' : '') + '</div>' +
      '<div><span>Launch mass</span><b>' + Math.round(res.startResult.sys.launchMass) + ' → ' + Math.round(res.launchMass) + ' kg</b></div>' +
      '<div><span>Limiting crater (edge)</span><b>' + sig(r.pairs.limEdge, 3) + ' m, ' + esc(r.pairs.limiterEdge) + '</b></div>' +
      '<div><span>Search</span><b>' + res.evals.toLocaleString('en-US') + ' evaluations · ' + (res.elapsedMs / 1000).toFixed(1) + ' s</b></div></div>';
    html += '<h3>Changed sliders</h3>' + (res.changed.length ? '<table class="tt"><tbody>' + res.changed.map(function (c) {
      return '<tr><td>' + esc(sliderLabel(c.k)) + '</td><td class="r">' + esc(sliderFmt(c.k, c.from)) + '</td><td>→</td><td class="r"><b>' + esc(sliderFmt(c.k, c.to)) + '</b></td></tr>'; }).join('') + '</tbody></table>' : '<div class="muted">none — the starting point is already the best found</div>');
    html += '<h3>Limits</h3><table class="tt"><tbody>' + res.constraints.map(function (c) {
      var bind = c.enabled && c.ok && c.margin < 0.02;
      return '<tr><td>' + esc(c.label) + '</td><td class="r">' + esc(fmtVal(c)) + '</td><td class="r">' + esc(c.sense + ' ' + fmtLim(c)) + '</td><td class="r">' + (c.margin >= 0 ? '+' : '') + (c.margin * 100).toFixed(1) + ' %</td><td class="' + (!c.enabled ? 'off' : !c.ok ? 'bad' : 'good') + '">' + (!c.enabled ? 'off' : !c.ok ? 'VIOLATED' : bind ? 'binding' : 'ok') + '</td></tr>'; }).join('') + '</tbody></table>';
    html += '<div class="btns"><button type="button" class="btn primary" id="optApply">' + (res.feasible ? 'Apply' : 'Apply least-infeasible point') + '</button><button type="button" class="btn" id="optDiscard">Discard</button></div>';
    d.innerHTML = html;
  }
  function applyOpt() {
    var res = opt.result; if (!res || res.nothing) return;
    opt.undo = Object.assign({}, state);
    res.changed.forEach(function (c) { state[c.k] = c.to; });
    state.orient = 'auto';
    if (res.state.preset === 'custom') state.preset = 'custom';
    document.getElementById('undoOpt').hidden = false;
    closeOpt(); update();
  }
  function wireOpt() {
    document.getElementById('optBtn').addEventListener('click', openOpt);
    document.getElementById('undoOpt').addEventListener('click', function () {
      if (!opt.undo) return; state = opt.undo; opt.undo = null; this.hidden = true; update();
    });
    document.getElementById('optModal').addEventListener('click', function (e) {
      var t = e.target;
      if (t.id === 'optModal') return;   // clicks on the backdrop do nothing (no accidental loss of a result)
      var pr = t.closest('[data-preset]');
      if (pr) { var v = pr.getAttribute('data-preset'); locks = v === 'all' ? OPT.allLocks(true) : v === 'none' ? OPT.allLocks(false) : OPT.defaultLocks(); persistLocks(); syncControls(); renderOptSetup(); return; }
      if (t.id === 'optRun') startOpt();
      else if (t.id === 'optCancel') { if (opt.run) opt.run.cancel(); }
      else if (t.id === 'optClose' || t.id === 'optDiscard') closeOpt();
      else if (t.id === 'optApply') applyOpt();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !document.getElementById('optModal').hidden && !opt.run) closeOpt(); });
  }

  // ------------------------------------------------------------------ init
  function init() {
    buildKpis();
    buildPanel(document.getElementById('rightBody'), MON, RO_MON, 'monitor');
    buildPanel(document.getElementById('leftBody'), IMG, RO_IMG, 'imager');
    wireControls(document.getElementById('rightBody'));
    wireControls(document.getElementById('leftBody'));
    view = new window.OTEView3D(document.getElementById('c3d'));
    var simt = document.getElementById('simt');
    view.onTime = function (t) {
      if (!lastRes) return;
      simt.textContent = 't = ' + (t / 3600).toFixed(1) + ' h · monitor ' + (t / lastRes.mon.orbit.T).toFixed(2) + ' rev · imager ' + (t / lastRes.img.orbit.T).toFixed(2) + ' rev';
    };
    var play = document.getElementById('play');
    play.addEventListener('click', function () { view.setPlaying(!view.playing); play.textContent = view.playing ? 'Pause' : 'Play'; });
    document.getElementById('speed').addEventListener('change', function (e) { view.speed = +e.target.value; });
    document.getElementById('resetView').addEventListener('click', function () { view.resetView(); });
    document.getElementById('resetAll').addEventListener('click', function () {
      state = Object.assign({}, B); locks = OPT.defaultLocks(); persistLocks();
      var fs = document.getElementById('fcSensor'); if (fs) fs.value = state.sensor;
      update();
    });
    buildTabs();
    buildLimits();
    wireOpt();
    var sel = document.getElementById('fcSensor');
    sel.value = state.sensor;
    sel.addEventListener('change', function () { state.sensor = sel.value; persist(); markFlashStale(); });
    if (typeof ResizeObserver !== 'undefined') {
      var pend = false;
      new ResizeObserver(function () { if (pend) return; pend = true; requestAnimationFrame(function () { pend = false; drawTab(); }); }).observe(document.getElementById('tabwrap'));
    }
    window.addEventListener('resize', function () { drawTab(); });
    update();
    window.__OTE_READY = true;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
